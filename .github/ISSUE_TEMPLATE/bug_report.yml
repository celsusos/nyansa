name: Bug report
description: Something in the agent, control plane, or UI does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use the Security tab →
        Report a vulnerability. See [SECURITY.md](../blob/main/SECURITY.md).

        Scrub API keys, tokens, and internal hostnames from anything you paste.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Agent CLI
        - Control plane (API)
        - Operator UI
        - VS Code extension
        - Installer / nyansa-init
        - Merge gate / attestations
        - Eval harness
        - Docs
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set `approval = "on-request"` in .nyansa/config.toml
        2. Run `uv run nyansa -p "..."`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Traceback, API response, or console output. Redact secrets.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 / a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows (native)
        - Docker / container
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model and provider
      description: Relevant for anything touching the agent loop, tools, or context.
      placeholder: "openai/gpt-4o-mini via OpenRouter / qwen2.5-coder:7b via Ollama"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: I removed all secrets from the output above
          required: true
