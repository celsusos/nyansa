services:
  - type: web
    name: nyansa-control-plane
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NYANSA_PRODUCTION
        value: "true"
      - key: NYANSA_BOOTSTRAP_SECRET
        generateValue: true
      - key: NYANSA_TOKEN_PEPPER
        generateValue: true
      - key: NYANSA_ATTESTATION_KEY_SEED
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nyansa-db
          property: connectionString

databases:
  - name: nyansa-db
